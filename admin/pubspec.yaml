name: seithati_weavers_admin
description: Private content manager for Seithati Weavers.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cloud_firestore: ^5.6.12
  firebase_auth: ^5.7.0
  firebase_core: ^3.15.2
  google_sign_in: ^6.3.0
  http: ^1.5.0
  http_parser: ^4.1.2
  image_picker: ^1.2.0
  mime: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/seithati-weavers-logo.png
